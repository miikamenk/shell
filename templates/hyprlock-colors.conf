# hyprlock colours, rendered by caelestia from the current scheme.
# Sourced from ~/.config/hypr/hyprlock.conf.

$text_color = rgba({{ primaryFixed.hex }}FF)
$entry_background_color = rgba({{ onPrimaryFixed.hex }}11)
$entry_border_color = rgba({{ outline.hex }}55)
$entry_color = rgba({{ primaryFixed.hex }}FF)
$font_family = Google Sans Flex Medium
$font_family_clock = Google Sans Flex Medium
$font_material_symbols = Material Symbols Rounded

# No $background_image here: iNiR's template defined one, but nothing in
# hyprlock.conf ever referenced it.
