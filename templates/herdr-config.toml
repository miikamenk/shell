# herdr configuration, rendered by caelestia from the current scheme.
#
# DO NOT EDIT THIS FILE: it is a symlink to a file caelestia regenerates on
# every scheme or wallpaper change, and edits are lost at that point. Change
# templates/herdr-config.toml in the shell repo instead — herdr has no include
# mechanism, so the whole config lives in the template, not just the colours.

# Show first-run notification setup on startup.
onboarding = false

[theme]
# Base theme. Every token herdr lets us override is set from the scheme below,
# so this only supplies the handful it does not expose.
name = "catppuccin"

# The tokens map onto herdr's catppuccin-shaped names by role, not by hue: the
# surface ladder is the Material elevation ladder, and the named colours are
# the semantic families the rest of the desktop uses, so a herdr pane reads as
# part of it.
[theme.custom]
# Chrome background — the same colour the shell's panels and the terminal
# background come from.
panel_bg = "#{{ background.hex }}"

# Surface ladder: dim → surface0 → surface1 climbs the elevation steps.
surface_dim = "#{{ surfaceContainerLow.hex }}"
surface0 = "#{{ surfaceContainer.hex }}"
surface1 = "#{{ surfaceContainerHigh.hex }}"

# Borders and dividers.
overlay0 = "#{{ outlineVariant.hex }}"
overlay1 = "#{{ outline.hex }}"

# Text: subtext0 is the dimmed label colour, text the primary one.
subtext0 = "#{{ onSurfaceVariant.hex }}"
text = "#{{ onSurface.hex }}"

# Accent — highlights, focused pane borders, navigation UI.
accent = "#{{ primary.hex }}"

# Named colours follow the semantic role rather than the catppuccin name.
# Material has no warning family, so the tertiary one stands in for yellow and
# peach; mauve is the tone-shifted accent, a sibling of `accent` rather than a
# duplicate of it.
red = "#{{ error.hex }}"
green = "#{{ success.hex }}"
yellow = "#{{ tertiary.hex }}"
peach = "#{{ onTertiaryContainer.hex }}"
blue = "#{{ secondary.hex }}"
teal = "#{{ tertiaryFixed.hex }}"
mauve = "#{{ primaryFixedDim.hex }}"

[ui]
# Show detected/reported agent labels in split pane borders when no manual
# pane name is set.
show_agent_labels_on_pane_borders = true

[ui.sound]
# Play sounds when agents change state in background workspaces.
enabled = false

[ui.toast]
# Background notification popup delivery: ask the OS notification service
# directly, so herdr's toasts land in the shell's notification list.
delivery = "system"

[experimental]
# Save recent pane screen history across full server restarts.
pane_history = false
# Local Kitty graphics rendering for attached clients.
kitty_graphics = true
