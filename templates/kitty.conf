# kitty colours, rendered by caelestia from the current scheme.
#
# Deliberately the same mapping caelestia's own OSC sequences use
# (gen_sequences in caelestia/utils/theme.py): foreground onSurface,
# background surface, cursor secondary, colours 0-15 from term0-15. A new
# window reads this file and then the shell's first prompt cats those
# sequences; if the two disagreed, every new window and tab would visibly
# repaint on the first prompt.

# Basic colours
foreground              #{{ onSurface.hex }}
background              #{{ surface.hex }}

# Cursor
cursor                  #{{ secondary.hex }}
cursor_text_color       #{{ surface.hex }}

# Selection — OSC 17 in the sequences
selection_foreground    #{{ surface.hex }}
selection_background    #{{ secondary.hex }}

url_color               #{{ primary.hex }}

# Borders
active_border_color     #{{ primary.hex }}
inactive_border_color   #{{ outline.hex }}
bell_border_color       #{{ error.hex }}

# Tabs
active_tab_foreground   #{{ onPrimary.hex }}
active_tab_background   #{{ primary.hex }}
inactive_tab_foreground #{{ onSurfaceVariant.hex }}
inactive_tab_background #{{ surfaceContainer.hex }}

# Marks
mark1_foreground        #{{ surface.hex }}
mark1_background        #{{ primary.hex }}
mark2_foreground        #{{ surface.hex }}
mark2_background        #{{ secondary.hex }}
mark3_foreground        #{{ surface.hex }}
mark3_background        #{{ tertiary.hex }}

# The 16 ANSI colours
color0  #{{ term0.hex }}
color1  #{{ term1.hex }}
color2  #{{ term2.hex }}
color3  #{{ term3.hex }}
color4  #{{ term4.hex }}
color5  #{{ term5.hex }}
color6  #{{ term6.hex }}
color7  #{{ term7.hex }}
color8  #{{ term8.hex }}
color9  #{{ term9.hex }}
color10 #{{ term10.hex }}
color11 #{{ term11.hex }}
color12 #{{ term12.hex }}
color13 #{{ term13.hex }}
color14 #{{ term14.hex }}
color15 #{{ term15.hex }}
